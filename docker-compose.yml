version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
